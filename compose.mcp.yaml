# Append after the V1.6 identity and V1.7 compute overlays.
# Defaults to direct transport; set ASTRONOMY_TOOL_TRANSPORT=mcp in the private env file to enable MCP.
services:
  backend:
    image: astroagent-backend:1.8.0
    environment:
      ASTROAGENT_ASTRONOMY_TOOL_TRANSPORT: "${ASTRONOMY_TOOL_TRANSPORT:-direct}"
  frontend:
    image: astroagent-frontend:1.8.0
  ingress:
    image: astroagent-ingress:1.8.0
