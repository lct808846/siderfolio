name: Tests

on: [push, pull_request]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: astroagent_test_control
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astroagent_test_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTROAGENT_RUN_POSTGRES_TESTS: "1"
      ASTROAGENT_RUN_LARGE_ACCEPTANCE: "1"
      ASTROAGENT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/astroagent_test_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Prepare real isolated plotting runtimes
        run: |
          docker build -f containers/plotting/python.Dockerfile -t astroagent-ci-plot-python containers/plotting
          docker build -f containers/plotting/gnuplot.Dockerfile -t astroagent-ci-plot-gnuplot containers/plotting
          echo "ASTROAGENT_PLOT_EXECUTION_ENABLED=true" >> "$GITHUB_ENV"
          echo "ASTROAGENT_PLOT_PYTHON_IMAGE=$(docker image inspect --format '{{.Id}}' astroagent-ci-plot-python)" >> "$GITHUB_ENV"
          echo "ASTROAGENT_PLOT_GNUPLOT_IMAGE=$(docker image inspect --format '{{.Id}}' astroagent-ci-plot-gnuplot)" >> "$GITHUB_ENV"
      - run: python -m pytest -m postgres -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Audit all frontend dependencies
        run: |
          audit_status=0
          npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          cat "$RUNNER_TEMP/npm-audit.json"
          python ../scripts/check_frontend_audit.py "$RUNNER_TEMP/npm-audit.json" "$audit_status"
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run test && npm run build
        working-directory: frontend
      - run: python scripts/generate_frontend_types.py --check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - run: npx playwright test --config playwright.mail-navigation.ts
        working-directory: frontend
