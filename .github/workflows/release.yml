name: Formal release

on:
  push:
    tags: ['v*.*.*']

permissions: {}
concurrency:
  group: astroagent-formal-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and version metadata
        id: tag
        env:
          SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          REQUIRE_SIGNED_TAG: ${{ vars.REQUIRE_SIGNED_TAG }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEPLOY_MODE: ${{ vars.PRODUCTION_DEPLOY_MODE }}
        run: |
          if [[ "$DEPLOY_MODE" != ssh ]] &&
             [[ "$REQUIRE_SIGNED_TAG" == true || -n "$SIGNING_PUBLIC_KEY" ]]; then
            [[ "$REF_PROTECTED" == true ]] || { echo 'A protected tag is required.' >&2; exit 1; }
            [[ "$SIGNING_PUBLIC_KEY" =~ ^(ssh-ed25519|sk-ssh-ed25519@openssh.com)[[:space:]][a-zA-Z0-9+/=]+$ ]] || {
              echo 'Configure the release signing public key for the restricted deployment.' >&2
              exit 1
            }
            printf 'astroagent-release namespaces="git" %s\n' "$SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/release-signers"
            python scripts/release_assets.py authorize "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-signers"
          else
            echo "Verifying the release tag against main and the version metadata."
            python scripts/release_assets.py authorize-unsigned "$GITHUB_REF_NAME"
          fi

  checks:
    needs: authorization
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ needs.authorization.outputs.sha }}

  images:
    needs: [authorization, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: release-registry
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, ingress, postgres, compute-worker, plot-executor, plot-python, plot-gnuplot]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorization.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUBLISH_TOKEN && vars.GHCR_PUBLISH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || github.token }}
      - name: Publish digest and immutable release aliases
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.authorization.outputs.version }}
          REVISION: ${{ needs.authorization.outputs.sha }}
        run: |
          python scripts/release_assets.py publish "$COMPONENT" "$VERSION" "$REVISION" "${GITHUB_REPOSITORY,,}" "image-$COMPONENT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.json
          if-no-files-found: error

  manifest:
    needs: [authorization, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorization.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-parts
      - name: Collect the tested source and image identities
        env:
          VERSION: ${{ needs.authorization.outputs.version }}
          REVISION: ${{ needs.authorization.outputs.sha }}
        run: |
          python scripts/release_assets.py assemble "$VERSION" "$REVISION" "${GITHUB_REPOSITORY,,}" image-parts release.json
          {
            printf '### Release %s (%s)\n\n```json\n' "$VERSION" "$REVISION"
            cat release.json
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.PRODUCTION_DEPLOY_MODE != 'ssh'
        with:
          subject-path: release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error

  production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [authorization, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorization.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Verify the release manifest
        if: vars.PRODUCTION_DEPLOY_MODE != 'ssh'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.authorization.outputs.sha }}
        run: |
          gh attestation verify release.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$REVISION" --deny-self-hosted-runners
      - uses: google-github-actions/auth@v3
        if: vars.PRODUCTION_DEPLOY_MODE != 'ssh'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.PRODUCTION_DEPLOY_MODE != 'ssh'
      - name: Deploy and verify through the restricted IAP SSH command
        if: vars.PRODUCTION_DEPLOY_MODE != 'ssh'
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_VM: ${{ vars.GCP_VM }}
          DEPLOY_KEY: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOST: ${{ secrets.GCP_DEPLOY_KNOWN_HOST }}
        run: |
          umask 077
          printf 'Workflow %s, version %s\n' "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" > deployment-report.log
          [[ "$GCP_VM" =~ ^[a-z][a-z0-9-]+$ && -n "$GCP_PROJECT" && -n "$GCP_ZONE" ]]
          [[ -n "$DEPLOY_KEY" && "$SSH_KNOWN_HOST" == 'astroagent-production ssh-ed25519 '* ]]
          key_dir=$(mktemp -d)
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOST" > "$key_dir/known_hosts"
          unset DEPLOY_KEY SSH_KNOWN_HOST
          gcloud compute start-iap-tunnel "$GCP_VM" 22 --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --local-host-port=127.0.0.1:22122 --quiet > "$key_dir/iap.log" 2>&1 &
          iap_pid=$!
          trap 'kill "$iap_pid" 2>/dev/null || true; rm -f -- "$key_dir/key" "$key_dir/known_hosts" "$key_dir/iap.log"; rmdir -- "$key_dir"' EXIT
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 22122; then break; fi
            if ! kill -0 "$iap_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 22122; then
            printf 'IAP tunnel did not start. Check the runner identity, instance and firewall.\n' | tee -a deployment-report.log
            exit 1
          fi
          ssh -F /dev/null -T -p 22122 -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlias=astroagent-production -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectTimeout=15 \
            astroagent-release@127.0.0.1 apply < release.json 2>&1 | tee -a deployment-report.log
      - name: Deploy directly to GCP VM over SSH
        if: vars.PRODUCTION_DEPLOY_MODE == 'ssh'
        env:
          DEPLOY_HOST: ${{ secrets.GCP_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.GCP_DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          DEPLOY_PORT: ${{ secrets.GCP_SSH_PORT || '22' }}
          DEPLOY_KNOWN_HOST: ${{ secrets.GCP_SSH_KNOWN_HOST }}
          RELEASE_TAG: ${{ needs.authorization.outputs.version }}
          RELEASE_SHA: ${{ needs.authorization.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'Workflow %s, version %s (%s), mode=ssh\n' "$GITHUB_RUN_ID" "$RELEASE_TAG" "$RELEASE_SHA" > deployment-report.log
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$DEPLOY_PATH" == /* && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOST" ]] || {
            echo 'Configure the server address, user, absolute path, SSH private key and pinned host key.' | tee -a deployment-report.log
            exit 1
          }
          key_dir=$(mktemp -d)
          trap 'rm -f -- "$key_dir/key" "$key_dir/known_hosts"; rmdir -- "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > "$key_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOST
          ssh_opts=(
            -F /dev/null -T -p "$DEPLOY_PORT" -i "$key_dir/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15
            -o ServerAliveCountMax=3 -o ConnectTimeout=20 -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$key_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_TRACE_REDACT=1
          cd -- "$1"
          origin_url="$(git remote get-url origin)"
          if [[ "$origin_url" == "https://github.com/lct808846/astroagent.git" && "$4" == "lct808846/siderfolio" ]]; then
            git remote set-url origin "https://github.com/$4.git"
            origin_url="$(git remote get-url origin)"
          fi
          [[ "$(git rev-parse --show-toplevel)" == "$(pwd -P)" &&
             "$origin_url" == "https://github.com/$4.git" &&
             -z "$(git status --porcelain --untracked-files=no)" ]] || {
            echo 'Use a clean production checkout of the expected repository.' >&2
            exit 1
          }
          [[ -f containers/gcp/.env && ! -L containers/gcp/.env &&
             "$(stat -c '%a' containers/gcp/.env)" == 600 ]] || {
            echo 'Prepare containers/gcp/.env with mode 600 before releasing.' >&2
            exit 1
          }
          docker info >/dev/null
          IFS= read -r github_token
          [[ -n "$github_token" ]]
          git_auth=$(printf 'x-access-token:%s' "$github_token" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $git_auth" \
            git -c credential.helper= fetch --no-tags origin "refs/tags/$2:refs/tags/$2" </dev/null
          unset git_auth
          [[ "$(git rev-parse "refs/tags/$2^{commit}")" == "$3" ]]
          git checkout --detach "$3" </dev/null
          { printf '%s\n' "$github_token"; cat; } | \
            python3 scripts/release_assets.py deploy-ssh "$2" "$3" "${4,,}" "$5"
          REMOTE
          )
          command="bash -c $(printf '%q' "$remote_script") bash $(printf '%q ' \
            "$DEPLOY_PATH" "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$GHCR_USER")"
          { printf '%s\n' "$GHCR_TOKEN"; cat release.json; } | \
            ssh "${ssh_opts[@]}" -- "${DEPLOY_USER}@${DEPLOY_HOST}" "$command" \
            2>&1 | tee -a deployment-report.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-report
          path: deployment-report.log

  publish-release:
    needs: [authorization, production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorization.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - uses: actions/download-artifact@v4
        with:
          name: production-report
      - name: Attach the verified release and deployment report
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorization.outputs.version }}
          REVISION: ${{ needs.authorization.outputs.sha }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > existing-release.json; then
            jq -e '(.isDraft == false) and ([.assets[].name] | contains(["release.json", "deployment-report.log"]))' existing-release.json >/dev/null
          else
            python scripts/release_assets.py notes "$VERSION" "$REVISION" "${GITHUB_REPOSITORY,,}" release-notes.md
            gh release create "$VERSION" release.json deployment-report.log --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Siderfolio $VERSION" --notes-file release-notes.md
          fi
