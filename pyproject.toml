[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroagent"
version = "0.2.0"
description = "基于 DeepSeek 工具调用、SIMBAD 与 ADS 的天文科研查询服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "astroquery>=0.4.8,<0.5",
    "pydantic-settings>=2.6,<3",
    "requests>=2.32,<3",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "openai>=2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests using real external services (may incur model charges)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
