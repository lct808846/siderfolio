[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroagent"
version = "0.9.0"
description = "基于 DeepSeek、SIMBAD、ADS 与 Gaia DR3 的天文查询与基础分析服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "astroquery>=0.4.8,<0.5",
    "astropy>=6.1,<9",
    "defusedxml>=0.7.1,<1",
    "pydantic-settings>=2.6,<3",
    "requests>=2.32,<3",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "openai>=2,<4",
    "pypdf==6.21.4",
    "python-multipart==0.0.32",
    "starlette>=0.47.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests using real external services (may incur model charges)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
