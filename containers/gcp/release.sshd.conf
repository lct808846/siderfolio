# Install as /etc/ssh/sshd_config.d/90-astroagent-release.conf
Match User astroagent-release
    AuthorizedKeysFile /etc/ssh/authorized_keys/astroagent-release
    AuthenticationMethods publickey
    PasswordAuthentication no
    DisableForwarding yes
    PermitTTY no
    ForceCommand /usr/local/sbin/astroagent-release-ssh
Match all
